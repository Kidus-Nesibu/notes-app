<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ note.title }}</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{
    background:#f4f4f4;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.container{

    width:600px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);

}


h1{

    margin-bottom:20px;
    color:#222;

}


.note-content{

    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    min-height:150px;
    color:#555;
    line-height:1.6;
    margin-bottom:30px;

}


.buttons{

    display:flex;
    gap:15px;
    flex-wrap:wrap;

}


a{

    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
    font-size:15px;
}


.edit{

    background:#facc15;
    color:black;

}


.delete{

    background:#ef4444;
    color:white;

}


.home{

    background:#2563eb;
    color:white;

}


a:hover{

    opacity:.85;

}


</style>

</head>


<body>


<div class="container">


<h1>{{ note.title }}</h1>


<div class="note-content">

{{ note.content }}

</div>



<div class="buttons">


<a class="edit" href="{% url 'edit_note' note.pk %}">
    Edit
</a>



<a class="delete" href="{% url 'delete_note' note.pk %}">
    Delete
</a>



<a class="home" href="{% url 'home' %}">
    Back Home
</a>


</div>


</div>


</body>

</html>
