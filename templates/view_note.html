<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ note.title }}</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, Arial, Helvetica, sans-serif;
}


body{

    background:#f8fafc;

    min-height:100vh;

    display:flex;
    justify-content:center;

    padding:40px 20px;

}



/* PAGE */

.container{

    width:800px;

    max-width:100%;

}



/* HEADER */


.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:35px;

}



.brand{

    display:flex;

    align-items:center;

    gap:12px;

}



.logo{

    width:42px;

    height:42px;

    background:#2563eb;

    color:white;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

}



.brand span{

    font-size:22px;

    font-weight:700;

}



/* DOCUMENT */


.document{

    background:white;

    padding:50px;

    border-radius:18px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.08);

}



.date{

    color:#9ca3af;

    font-size:14px;

    margin-bottom:20px;

}



h1{

    font-size:42px;

    letter-spacing:-1px;

    color:#111827;

    margin-bottom:30px;

}



.divider{

    height:1px;

    background:#e5e7eb;

    margin-bottom:30px;

}



.note-content{

    font-size:18px;

    line-height:1.8;

    color:#374151;

    white-space:pre-line;

    min-height:200px;

}



/* BUTTONS */


.buttons{

    margin-top:40px;

    display:flex;

    gap:15px;

}



a{

    text-decoration:none;

}



button{

    padding:12px 25px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    transition:.2s;

}



button:hover{

    transform:translateY(-2px);

}



.edit{

    background:#facc15;

    color:#111;

}



.delete{

    background:#ef4444;

    color:white;

}



.home{

    background:#2563eb;

    color:white;

}




@media(max-width:700px){

    .document{

        padding:30px;

    }


    h1{

        font-size:32px;

    }


    .buttons{

        flex-direction:column;

    }


    button{

        width:100%;

    }

}


</style>


</head>


<body>


<div class="container">


<div class="top-bar">


<div class="brand">

<div class="logo">
    ✎
</div>


<span>
    NoteFlow
</span>


</div>


</div>




<div class="document">


<div class="date">
    Your personal note
</div>


<h1>
    {{ note.title }}
</h1>


<div class="divider"></div>



<div class="note-content">

{{ note.content }}

</div>




<div class="buttons">


<a href="{% url 'edit_note' note.pk %}">

<button class="edit">
    Edit Note
</button>

</a>



<a href="{% url 'delete_note' note.pk %}">

<button class="delete">
    Delete
</button>

</a>



<a href="{% url 'home' %}">

<button class="home">
    Back to Notes
</button>

</a>



</div>


</div>


</div>


</body>

</html>
