<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f1f3f4;
}

/* Navigation */

.navbar{
    background:white;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 50px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    position:sticky;
    top:0;
}

.logo{
    font-size:26px;
    font-weight:bold;
    color:#1a73e8;
}

.right{
    display:flex;
    align-items:center;
    gap:15px;
}

.welcome{
    color:#666;
    font-size:15px;
}

button{
    padding:11px 22px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
    font-size:15px;
}

button:hover{
    transform:translateY(-1px);
}

.new{
    background:#1a73e8;
    color:white;
}

.logout{
    background:#e8eaed;
}

a{
    text-decoration:none;
}

/* Main Content */

.container{
    width:900px;
    margin:50px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    font-size:34px;
}

.header p{
    color:#777;
    margin-top:8px;
}

/* Notes List */

.notes{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.note{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 30px;
    border-bottom:1px solid #eee;
    transition:.2s;
}

.note:hover{
    background:#fafafa;
}

.note:last-child{
    border-bottom:none;
}

.note-info h3{
    color:#222;
    margin-bottom:8px;
}

.note-info p{
    color:#777;
    font-size:14px;
}

.note-actions{
    display:flex;
    gap:10px;
}

.edit{
    background:#fbbc04;
}

.delete{
    background:#ea4335;
    color:white;
}

.empty{
    padding:60px;
    text-align:center;
    color:#888;
}

</style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        Notes
    </div>

    <div class="right">

        <span class="welcome">
            Welcome, {{ request.user.username }}
        </span>

        <a href="{% url 'logout' %}">
            <button class="logout">
                Logout
            </button>
        </a>

    </div>

</div>

<div class="container">

    <div class="header">

        <div>

            <h1>My Notes</h1>

            <p>Your personal workspace.</p>

        </div>

        <a href="{% url 'note' %}">
            <button class="new">
                + New Note
            </button>
        </a>

    </div>

    <div class="notes">

        {% for note in notes %}

        <div class="note">

            <div class="note-info">

                <a href="{% url 'view_note' note.pk %}">
                    <h3>{{ note.title }}</h3>
                </a>

                <p>{{ note.content|truncatechars:100 }}</p>

            </div>

            <div class="note-actions">

                <a href="{% url 'edit_note' note.pk %}">
                    <button class="edit">
                        Edit
                    </button>
                </a>

                <a href="{% url 'delete_note' note.pk %}">
                    <button class="delete">
                        Delete
                    </button>
                </a>

            </div>

        </div>

        {% empty %}

        <div class="empty">

            <h2>No notes yet</h2>

            <br>

            <p>Create your first note and start writing.</p>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
