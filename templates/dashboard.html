<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NoteFlow</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, Arial, Helvetica, sans-serif;
}


body{

    background:#f8fafc;
    color:#111827;

}



/* NAVBAR */


.navbar{

    background:white;

    height:75px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 60px;

    box-shadow:0 2px 10px rgba(0,0,0,.06);

    position:sticky;

    top:0;

    z-index:10;

}



.brand{

    display:flex;

    align-items:center;

    gap:12px;

}



.logo{

    width:42px;

    height:42px;

    background:#2563eb;

    color:white;

    border-radius:12px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:22px;

}



.brand-name{

    font-size:24px;

    font-weight:700;

}



.right{

    display:flex;

    align-items:center;

    gap:20px;

}



.welcome{

    color:#6b7280;

    font-size:15px;

}



button{

    border:none;

    cursor:pointer;

    padding:12px 22px;

    border-radius:10px;

    font-size:15px;

    transition:.2s;

}



button:hover{

    transform:translateY(-2px);

}



.logout{

    background:#f1f5f9;

    color:#111827;

}



.new{

    background:#2563eb;

    color:white;

}




a{

    text-decoration:none;

}



/* MAIN */


.container{

    width:950px;

    max-width:90%;

    margin:50px auto;

}



.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:35px;

}



.header h1{

    font-size:38px;

    letter-spacing:-1px;

}



.header p{

    color:#6b7280;

    margin-top:8px;

}





/* NOTES */


.notes{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,.06);

}



.note{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:25px 35px;

    border-bottom:1px solid #e5e7eb;

    transition:.25s;

}



.note:hover{

    background:#fafafa;

}



.note:last-child{

    border-bottom:none;

}




.note-info h3{

    color:#111827;

    font-size:20px;

    margin-bottom:8px;

    cursor:pointer;

    display:flex;

    align-items:center;

    gap:8px;

    transition:.2s;

}



.note-info h3:hover{

    color:#2563eb;

}



.arrow{

    opacity:0;

    font-size:18px;

    transition:.2s;

}



.note-info h3:hover .arrow{

    opacity:1;

}



.note-info p{

    color:#6b7280;

    font-size:14px;

    max-width:500px;

}





.note-actions{

    display:flex;

    gap:10px;

}



.edit{

    background:#facc15;

}



.delete{

    background:#ef4444;

    color:white;

}





.empty{

    padding:70px;

    text-align:center;

    color:#6b7280;

}



.empty h2{

    color:#111827;

    margin-bottom:10px;

}





@media(max-width:700px){


.navbar{

    padding:0 20px;

}



.welcome{

    display:none;

}



.container{

    max-width:95%;

}



.header{

    flex-direction:column;

    align-items:flex-start;

    gap:20px;

}



.note{

    flex-direction:column;

    align-items:flex-start;

    gap:20px;

}



.note-actions{

    width:100%;

}



.note-actions button{

    flex:1;

}


}


</style>


</head>



<body>



<div class="navbar">



<div class="brand">


<div class="logo">
    ✎
</div>


<div class="brand-name">
    NoteFlow
</div>


</div>





<div class="right">


<span class="welcome">
    Welcome, {{ request.user.username }}
</span>




<a href="{% url 'logout' %}">

<button class="logout">

Logout

</button>

</a>



</div>



</div>







<div class="container">





<div class="header">



<div>

<h1>
    My Notes
</h1>


<p>
    Your personal space for ideas and memories.
</p>


</div>




<a href="{% url 'note' %}">

<button class="new">

+ New Note

</button>

</a>




</div>







<div class="notes">



{% for note in notes %}



<div class="note">





<div class="note-info">



<a href="{% url 'view_note' note.pk %}">


<h3>

{{ note.title }}

<span class="arrow">
    →
</span>


</h3>


</a>



<p>
{{ note.content|truncatechars:100 }}
</p>



</div>







<div class="note-actions">



<a href="{% url 'edit_note' note.pk %}">


<button class="edit">

Edit

</button>


</a>





<a href="{% url 'delete_note' note.pk %}">


<button class="delete">

Delete

</button>


</a>





</div>






</div>




{% empty %}



<div class="empty">


<h2>
    No notes yet
</h2>


<p>
Create your first note and start writing.
</p>


</div>



{% endfor %}



</div>





</div>



</body>


</html>
