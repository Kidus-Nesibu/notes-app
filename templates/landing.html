<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:50px;
    border-radius:12px;
    width:500px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
    font-size:42px;
    margin-bottom:15px;
}

p{
    color:#666;
    margin-bottom:35px;
    line-height:1.6;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

a{
    text-decoration:none;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.signup{
    background:#2563eb;
    color:white;
}

.login{
    background:#e5e7eb;
}

button:hover{
    transform:translateY(-2px);
}
</style>

</head>

<body>

<div class="container">

    <h1>Notes App</h1>

    <p>
        Organize your thoughts, ideas, and tasks in one place.
        Sign up to create your personal workspace.
    </p>

    <div class="buttons">

        <a href="{% url 'signup' %}">
            <button class="signup">
                Sign Up
            </button>
        </a>

        <a href="{% url 'login' %}">
            <button class="login">
                Login
            </button>
        </a>

    </div>

</div>

</body>
</html>
