<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Note</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f1f3f4;
}


/* Navbar */

.navbar{

    height:70px;
    background:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 40px;

    box-shadow:0 2px 10px rgba(0,0,0,.06);

}


.logo{

    font-size:26px;
    font-weight:bold;
    color:#1a73e8;

}


.actions{

    display:flex;
    gap:15px;

}


button{

    padding:11px 22px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:15px;

    transition:.2s;

}


button:hover{

    transform:translateY(-1px);

}


.save{

    background:#1a73e8;
    color:white;

}


.back{

    background:#e8eaed;
    color:#333;

}


a{

    text-decoration:none;

}



/* Editor */

.editor{

    max-width:900px;

    margin:50px auto;

    background:white;

    padding:60px;

    border-radius:12px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}



.title{

    width:100%;

    border:none;

    outline:none;

    font-size:36px;

    font-weight:bold;

    margin-bottom:30px;

}



.content{

    width:100%;

    min-height:500px;

    border:none;

    outline:none;

    resize:none;

    font-size:18px;

    line-height:1.8;

}



</style>

</head>


<body>


<form method="POST">

{% csrf_token %}


<div class="navbar">


    <div class="logo">

        Notes

    </div>


    <div class="actions">


        <a href="{% url 'dashboard' %}">

            <button type="button" class="back">

                ← Dashboard

            </button>

        </a>


        <button class="save" type="submit">

            Save Changes

        </button>


    </div>


</div>



<div class="editor">


<input

class="title"

type="text"

name="title"

value="{{ note.title }}"

>



<textarea

class="content"

name="content"

>{{ note.content }}</textarea>



</div>


</form>


</body>

</html>
